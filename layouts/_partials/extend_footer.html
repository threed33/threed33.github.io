{{- /* threed33 自定义：左侧常驻目录双向精准滚动联动（scroll-spy）。
     仅文章页有 .toc-aside 时生效，其余页面无操作。 */ -}}
<script>
(function () {
    var aside = document.querySelector('.toc-aside');
    if (!aside) return;
    var nav = aside.querySelector('nav#TableOfContents') || aside.querySelector('nav');
    if (!nav) return;
    var links = Array.prototype.slice.call(nav.querySelectorAll('a[href^="#"]'));
    if (!links.length) return;

    var byId = {}, headings = [];
    links.forEach(function (l) {
        var id = decodeURIComponent(l.getAttribute('href').slice(1));
        var h = document.getElementById(id);
        if (h) { byId[id] = l; headings.push(h); }
    });
    if (!headings.length) return;

    var cur = null;
    function setActive(id) {
        var next = byId[id];
        if (!next || next === cur) return;
        if (cur) cur.classList.remove('toc-active');
        next.classList.add('toc-active');
        cur = next;
        /* 激活项若滚出目录视口，平滑调整目录滚动位置保持可见 */
        var r = next.getBoundingClientRect();
        var ar = aside.getBoundingClientRect();
        if (r.top < ar.top + 16) {
            aside.scrollTop -= (ar.top + 16 - r.top);
        } else if (r.bottom > ar.bottom - 16) {
            aside.scrollTop += (r.bottom - ar.bottom + 16);
        }
    }

    var OFFSET = 96; /* 吸顶 header (60px) + 呼吸余量 (36px) */
    var ticking = false;

    function updateActive() {
        ticking = false;
        var activeId = headings[0].id;
        for (var i = 0; i < headings.length; i++) {
            if (headings[i].getBoundingClientRect().top <= OFFSET) {
                activeId = headings[i].id;
            } else {
                break;
            }
        }
        setActive(activeId);
    }

    function onScroll() {
        if (!ticking) {
            window.requestAnimationFrame(updateActive);
            ticking = true;
        }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    updateActive();
})();
</script>
