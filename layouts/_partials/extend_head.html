{{- /* threed33 自定义：加宽正文 + 右侧常驻目录（类语雀）。
     仅用 CSS，服务端渲染，无闪烁。JS 见 extend_footer.html。 */ -}}
<style>
/* ── 正文加宽（720 → 800）并居中；导航条同宽，左右对齐 ── */
:root {
    --main-width: 800px;
    --nav-width: 800px;
}

/* ── 右侧目录：默认（窄屏）隐藏，交给顶部折叠目录 ── */
.toc-aside { display: none; }

/* ── 宽屏：正文居中，目录钉在「视口最左侧」（左侧空白槽里），
     与正文脱离 —— 正文 margin:auto 居中，目录 position:fixed 贴左沿 ── */
@media (min-width: 1340px) {
    .toc-aside {
        display: block;
        position: fixed;
        left: 16px;
        top: calc(var(--header-height) + 16px);
        width: 230px;
        max-height: calc(100vh - var(--header-height) - 32px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
    }
    /* 宽屏隐藏顶部折叠目录（左侧已有） */
    .post-single > details.toc { display: none; }
}

/* ── 目录外观 ── */
.toc-aside__title {
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    letter-spacing: .04em;
}
.toc-aside ul {
    list-style: none;
    margin: 0;
    padding: 0;
}
.toc-aside ul ul { padding-inline-start: 14px; }   /* 二级缩进 */
.toc-aside a {
    display: block;
    padding: 4px 10px;
    margin: 1px 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--secondary);
    text-decoration: none;
    border-left: 3px solid transparent;
    border-radius: 0 4px 4px 0;
    transition: color .15s, background .15s, border-color .15s;
    word-break: break-word;
}
.toc-aside a:hover { color: var(--primary); background: var(--code-bg); }
.toc-aside a.toc-active {
    color: var(--primary);
    font-weight: 600;
    background: var(--code-bg);
    border-left-color: var(--primary);
}
/* 锚点跳转避开吸顶 header */
.post-content :is(h2, h3, h4, h5, h6) {
    scroll-margin-top: calc(var(--header-height) + 16px);
}
/* webkit 细滚动条 */
.toc-aside::-webkit-scrollbar { width: 6px; }
.toc-aside::-webkit-scrollbar-thumb { background: var(--tertiary); border-radius: 3px; }
.toc-aside::-webkit-scrollbar-track { background: transparent; }

/* 尊重“减少动态”偏好 */
@media (prefers-reduced-motion: reduce) {
    .toc-aside a { transition: none; }
}
</style>
