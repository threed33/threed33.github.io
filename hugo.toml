# ──────────────────────────────────────────────────────────────
# Hugo 站点配置 · threed33.github.io
# 主题: PaperMod (themes/PaperMod, git submodule)
# ──────────────────────────────────────────────────────────────

baseURL                = "https://threed33.github.io/"
defaultContentLanguage = "zh"              # 对应 PaperMod 内置 i18n/zh.yaml 中文翻译
title                  = "threed33"
theme                  = "PaperMod"
enableRobotsTXT        = true
enableEmoji            = true
# enableGitInfo 设为 false：避免样式或目录结构重构提交误触发所有文章“更新于”日期；
# 实质性修订文章时在 Front Matter 显式添加 lastmod 即可显示更新日期。
enableGitInfo          = false
buildDrafts            = false             # 草稿(draft: true)不发布
buildFuture            = false
hasCJKLanguage         = true              # 中文/日文/韩文：正确断字、字数统计、阅读时长
summaryLength          = 80

[pagination]
  pagerSize = 10

[frontmatter]
  lastmod = ["lastmod", "date"]

# ── 语言 ───────────────────────────────────────────────────────
[languages]
  [languages.zh]
    label  = "中文"
    locale = "zh-cn"
    weight = 1

# ── 站点参数 (PaperMod) ────────────────────────────────────────
[params]
  env              = "production"
  defaultTheme     = "auto"                # auto / light / dark
  Title            = "threed33"
  author           = "threed33"
  description      = "threed33 的技术笔记与文章"
  DateFormat       = "2006-01-02"          # 统一简洁日期格式：YYYY-MM-DD
  mainSections     = ["posts"]
  images           = ["/og-cover.png"]     # 默认 OpenGraph / 社交分享封面

  [params.assets]
    theme_color             = "#18191c"
    msapplication_TileColor = "#18191c"

  # 文章与列表页功能开关
  ShowReadingTime                = true    # 阅读时长
  ShowWordCount                  = true    # 字数统计
  ShowLastMod                    = true    # 跨天更新时显示最后修改日期
  ShowBreadCrumbs                = true    # 面包屑导航
  ShowPostNavLinks               = true    # 上一篇 / 下一篇
  ShowCodeCopyButtons            = true    # 代码块一键复制
  ShowShareButtons               = false
  ShowPageNums                   = true    # 分页显示页码
  ShowRssButtonInSectionTermList = true
  ShowToc                        = true    # 文章目录 TOC（宽屏左侧常驻 / 窄屏顶部可折叠）
  TocMobileOpen                  = false   # 窄屏顶部目录默认折叠（由 layouts/_partials/toc.html 读取）
  UseHugoToc                     = true    # 使用 Hugo 原生 .TableOfContents
  disableSpecial1stPost          = true

  # 首页个人卡片
  [params.homeInfoParams]
    Title   = "你好 👋"
    Content = "这里是 threed33 的技术博客 —— 记录网络安全、攻防实践与日常学习笔记。"

  # 社交与订阅链接（首页卡片底部图标）
  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/threed33"
  [[params.socialIcons]]
    name = "rss"
    url  = "/index.xml"

  # 本地搜索配置（针对中文单字/短词检索调优）
  [params.fuseOpts]
    isCaseSensitive    = false
    shouldSort         = true
    location           = 0
    distance           = 1000
    threshold          = 0.3
    minMatchCharLength = 1
    keys               = ["title", "permalink", "summary", "content"]

# ── Markdown 渲染 ──────────────────────────────────────────────
[markup]
  [markup.highlight]
    codeFences  = true
    guessSyntax = true
    noClasses   = false                    # 启用 PaperMod 内置 chroma-styles.css，避免内联样式膨胀
    lineNos     = false
    tabWidth    = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                        # 允许 md 内嵌原始 HTML
  [markup.tableOfContents]                 # 大纲提取范围（H2 ~ H4）
    startLevel = 2
    endLevel   = 4
    ordered    = false

# ── 输出格式：JSON 用于本地搜索 ────────────────────────────────
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ── 顶部导航菜单 ───────────────────────────────────────────────
[[menu.main]]
  identifier = "posts"
  name       = "文章"
  url        = "/posts/"
  weight     = 10
[[menu.main]]
  identifier = "archives"
  name       = "归档"
  url        = "/archives/"
  weight     = 20
[[menu.main]]
  identifier = "tags"
  name       = "标签"
  url        = "/tags/"
  weight     = 30
[[menu.main]]
  identifier = "search"
  name       = "搜索"
  url        = "/search/"
  weight     = 40
[[menu.main]]
  identifier = "about"
  name       = "关于"
  url        = "/about/"
  weight     = 50
